name: Automation

on:
  schedule:
    - cron: '49 3 * * 1-5'  # 9:19 AM IST (Monday-Friday)
    - cron: '47 13 * * 1-5' # 7:17 PM IST (Monday-Friday)
  workflow_dispatch:
    inputs:
      mode:
        description: "PUNCH (check in/out) or STATUS_CHECK (read the widget only)"
        required: false
        default: PUNCH
        type: choice
        options:
          - PUNCH
          - STATUS_CHECK
      action:
        description: "ACTION_ALPHA (morning) or ACTION_BETA (evening)"
        required: false
        default: ACTION_ALPHA
        type: choice
        options:
          - ACTION_ALPHA
          - ACTION_BETA
      run_id:
        description: "Dispatch log id from the dashboard, for correlation"
        required: false
        type: string
      bypass_delay:
        description: "\"true\" when the operator skipped the random delay"
        required: false
        type: string
      delay_ms:
        description: "Jitter the dashboard already waited out, in ms"
        required: false
        type: string
      source:
        description: "MANUAL or CRON — who asked for this run"
        required: false
        default: MANUAL
        type: string
      form_url:
        description: "Override the Zoho sign-in URL (data centre)"
        required: false
        type: string

concurrency:
  group: automation-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 60 = the 40-minute hold-open budget (MAX_CHECKOUT_WAIT_MIN) plus the run
    # itself, the 5-minute transient backoff, and headroom.
    timeout-minutes: 60

    env:
      ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
      ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      # A manual dispatch may override the data centre; a scheduled run reads it
      # from the repository variable, so it is no longer empty on cron runs.
      FORM_URL: ${{ inputs.form_url || vars.FORM_URL }}
      # --- Where the punch claims to be, and who it claims to be ---
      # Zoho geofences the punch, so these must match the account's office.
      # They are repository *Variables* (Settings -> Secrets and variables ->
      # Actions -> Variables), NOT secrets: an office location and a timezone
      # are not credentials, and plaintext variables are easy to verify. Any
      # left unset falls back to the Pune / en-IN / Asia/Kolkata defaults baked
      # into bot.py, and a malformed value is rejected there in favour of the
      # default rather than punching from nowhere.
      PUNCH_LATITUDE: ${{ vars.PUNCH_LATITUDE }}
      PUNCH_LONGITUDE: ${{ vars.PUNCH_LONGITUDE }}
      LOCALE: ${{ vars.LOCALE }}
      TIMEZONE_ID: ${{ vars.TIMEZONE_ID }}
      # Minutes the check-out guard requires before it will punch out (default
      # 570 = 9h 30m). Set it if the employer's day differs.
      REQUIRED_MINUTES: ${{ vars.REQUIRED_MINUTES }}
      HEADLESS: "true"
      PYTHONUNBUFFERED: "1"
      DISPATCH_MODE: ${{ inputs.mode }}
      DISPATCH_ACTION: ${{ inputs.action }}
      DISPATCH_RUN_ID: ${{ inputs.run_id }}
      DISPATCH_SOURCE: ${{ inputs.source }}
      DISPATCH_DELAY_MS: ${{ inputs.delay_ms }}
      DISPATCH_BYPASS_DELAY: ${{ inputs.bypass_delay }}
      # Which cron fired, so the bot can tell a punctual run from one GitHub
      # delayed by hours. Empty on workflow_dispatch.
      SCHEDULED_CRON: ${{ github.event.schedule }}
      CONTROL_CENTER_URL: ${{ secrets.CONTROL_CENTER_URL }}
      DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # "failure" keeps trace.zip only when a run fails. Interception and the
      # locator ladder are confirmed working against live Zoho, so a ~14 MB
      # artifact per successful run is noise. Flip back to "on" while debugging.
      TRACE: "failure"
      STEALTH: "true"
      # Fernet key encrypting the saved Zoho session. Session cookies are
      # login-equivalent and Actions caches on a PUBLIC repo are readable by
      # forked-PR workflows, so without this secret the bot refuses to persist
      # a session at all and just signs in with an OTP every run.
      STATE_KEY: ${{ secrets.STATE_KEY }}
      # Optional: set these repository secrets only if GitHub's datacenter IPs
      # start getting blocked. Empty values are ignored by the bot.
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bot/requirements.txt') }}

      - name: Install Playwright browsers and system dependencies
        run: playwright install --with-deps chromium

      # Carries the encrypted Zoho session between runs so we do not burn an OTP
      # every time. The run_id key forces a fresh save each run while the prefix
      # restore-key picks up the most recent previous one (mutable-cache idiom).
      # The blob is useless without the STATE_KEY secret, which forked-PR
      # workflows never receive.
      - name: Restore saved Zoho session
        uses: actions/cache@v4
        with:
          path: bot/encrypted_state.enc
          key: session-state-${{ github.run_id }}
          restore-keys: |
            session-state-

      # Retries ONLY on exit 75 (EX_TEMPFAIL): DNS, proxy, runner network, or a
      # late OTP mail. A 9.5h safety abort or a bad credential exits 1 and stops
      # immediately - retrying those would just hammer Zoho's abuse filters.
      # A retry after a punch that already landed is safe: the bot re-reads the
      # widget and skips the duplicate.
      - name: Run Playwright bot
        run: |
          set +e
          attempt=1
          max_attempts=2
          backoff=300
          while : ; do
            python bot/bot.py
            code=$?
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 75 ]; then
              echo "::error::Bot failed with exit code $code (permanent) - not retrying."
              exit "$code"
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Transient failure persisted across $attempt attempts."
              exit "$code"
            fi
            echo "::warning::Transient failure on attempt $attempt; retrying in ${backoff}s."
            attempt=$((attempt + 1))
            sleep "$backoff"
          done

      # Failure-only: the screenshot already reaches the phone over Telegram on
      # every run, and a ~14 MB trace per successful run is pure noise.
      # `playwright show-trace trace.zip` replays the whole headless session.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trace.zip
            failure.png
          if-no-files-found: ignore
          retention-days: 14